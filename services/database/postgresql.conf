# ------------------------------------------------------------------------------
# POSTGRESQL CONFIGURATION FILE
# ------------------------------------------------------------------------------

# CONNECTIONS AND AUTHENTICATION
listen_addresses = '*'
port = 5432
max_connections = 100           # Sufficient for dev; scale up for prod

# MEMORY SETTINGS (Tuned for Development/Small Production)
shared_buffers = 128MB          # ~25% of RAM for dedicated DB server, keep low for dev
dynamic_shared_memory_type = posix
work_mem = 4MB                  # Memory used for sort/hash operations per client
maintenance_work_mem = 64MB     # Memory for VACUUM, CREATE INDEX, etc.

# WRITE AHEAD LOG (WAL)
wal_level = replica             # Standard for replication support
max_wal_size = 1GB
min_wal_size = 80MB

# QUERY TUNING
random_page_cost = 1.1          # Assume SSD storage (default is 4.0 for HDD)
effective_cache_size = 512MB    # Estimate of filesystem cache available

# LOGGING (Critical for debugging)
log_destination = 'stderr'
logging_collector = off         # Docker logs to stdout/stderr naturally
client_min_messages = notice
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000 # Log queries taking longer than 1s (Slow Query Log)
log_connections = on
log_disconnections = on
log_statement = 'ddl'           # Log schema changes (CREATE, ALTER, DROP)
log_timezone = 'UTC'

# CLIENT CONNECTION DEFAULTS
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# TEXT SEARCH
default_text_search_config = 'pg_catalog.english'
