# ==========================================================
#
#
# ==========================================================

x-common-labels: &common-labels
  labels:
    project.name: ${COMPOSE_PROJECT_NAME:-Matcha}
    org.opencontainers.image.title: Matcha
    org.opencontainers.image.description: A 42 Project dating application
    org.opencontainers.image.authors: ${MAINTAINER_NAME}
    org.opencontainers.image.version: ${VERSION}
    org.opencontainers.image.source: ${REPOSITORY_URL}
    org.opencontainers.image.licenses: ${LICENSE_TYPE}

# ==========================================================
#
# ==========================================================
services:
  # ==========================================================
  #
  # ==========================================================
  proxy:
    build:
      <<: *common-labels
      context: ./services/proxy
      dockerfile: Dockerfile
    image: matcha_proxy_image:${VERSION:-latest}
    container_name: matcha_proxy
    networks:
      - web_network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ==========================================================
  #
  # ==========================================================
  frontend:
    <<: *common-labels
    container_name: matcha_frontend
    networks:
      - web_network
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================================
  #
  # ==========================================================
  backend:
    <<: *common-labels
    container_name: matcha_backend
    networks:
      - web_network
      - data_network
    depends_on:
      - database
    restart: unless-stopped

  # ==========================================================
  #
  # ==========================================================
  database:
    <<: *common-labels
    build:
      context: ./services/database
      dockerfile: Dockerfile
    image: matcha_database_image:${VERSION:-latest}
    container_name: matcha_database
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - data_network
    restart: unless-stopped

# ==========================================================
#
# ==========================================================
volumes:
  nginx_certs:
    <<: *common-labels
    name: matcha_nginx_certs_volume
    driver: local

  db_data:
    <<: *common-labels
    name: matcha_postgres_volume
    driver: local

# ==========================================================
#
# ==========================================================
networks:
  web_network:
    driver: bridge

  data_network:
    driver: bridge
    internal: true
